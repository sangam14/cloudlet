[package]
name = "vmm"
description = "The Virtual Machine Manager for the Cloudlet serverless runtime"
authors = ["Polytech Montpellier DevOps - 2022/2025"]
license = "Apache-2.0"
readme = "README.md"
repository = "https://github.com/virt-do/cloudlet"
version = "0.1.0"
edition = "2021"
rust-version = "1.76.0"

[dependencies]
clap = { version = "4.5.61", features = ["derive", "env"] }
clap-verbosity-flag = "3.0.4"
epoll = "4.4.0"
event-manager = { version = "=0.4.2", features = ["remote_endpoint"] }
futures = "0.3.34"
iptables = "0.6.0"
kvm-bindings = { version = "0.13.0", features = ["fam-wrappers"] }
kvm-ioctls = "0.23.0"
libc = "0.2.189"
linux-loader = { version = "0.14.0", features = ["bzimage", "elf"] }
log = "0.4.34"
nix = { version = "0.31.3", features = ["term"] }
openpty = "0.2.0"
prost = "0.14"
rtnetlink = "0.23.0"
tokio = { version = "1.53.1", features = ["full"] }
tokio-stream = "0.1.19"
tonic = "0.14"
tonic-prost = "0.14"
tracing = "0.1.44"
tracing-subscriber = "0.3.23"
virtio-bindings = "0.2.7"
virtio-device = { git = "https://github.com/rust-vmm/vm-virtio.git", rev = "87bf424736548126983c278b0d49a7b061e38b12" }
virtio-queue = { git = "https://github.com/rust-vmm/vm-virtio.git", rev = "87bf424736548126983c278b0d49a7b061e38b12" }
vm-allocator = "0.1.4"
vm-device = "0.1.0"
vm-memory = { version = "0.18.0", features = ["backend-mmap"] }
vm-superio = "0.8.1"
vmm-sys-util = "0.14.0"

[build-dependencies]
tonic-build = "0.14"
tonic-prost-build = "0.14"
