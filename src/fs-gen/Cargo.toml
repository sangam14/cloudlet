[package]
name = "fs-gen"
version = "0.1.0"
edition = "2021"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[dependencies]
clap = { version = "4.6.6", features = ["derive", "wrap_help", "string"] }
dircpy = "0.3.20"
fuse-backend-rs = "0.14.0"
flate2 = "1.1.10"
once_cell = "1.21.4"
regex = "1.13.1"
reqwest = { version = "0.13.4", features = ["blocking", "json"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
signal-hook = "0.4.4"
tar = "0.4.46"
validator = { version = "0.21.0", features = ["derive"] }
anyhow = "1.0.104"
tracing = "0.1.44"
tracing-subscriber = {  version = "0.3.23", features = ["env-filter"] }
thiserror = "2.0.20"
clap-stdin = "0.8.1"
