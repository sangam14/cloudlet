[package]
name = "api"
version = "0.1.0"
edition = "2021"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[dependencies]
actix-web = "4.15.0"
serde = "1.0.229"
control_plane = { package = "cloudlet-control-plane", path="../control-plane" }
tokio = { version= "1.53.1", features= ["full"]}
tokio-stream = "0.1.19"
actix-web-lab = "0.27"
async-stream = "0.3"
futures = "0.3.34"
serde_json = "1.0"
include_dir = "0.7.4"
boxlite = "=0.10.0"
reqwest = { version = "0.13.4", default-features = false, features = ["json", "stream"] }
