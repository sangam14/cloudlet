[package]
name = "agent"
version = "0.1.0"
edition = "2021"

[lib]
name = "agent"
path = "src/lib.rs"

[dependencies]
async-trait = "0.1.92"
clap = { version = "4.6.6", features = ["derive", "env"] }
nix = { version = "0.31.3", features = ["signal", "user", "fs", "reboot"] }
once_cell = "1.21.4"
prost = "0.14.4"
rand = "0.10.2"
serde = { version = "1.0.229", features = ["derive"] }
tokio = { version = "1.53.1", features = ["full"] }
tokio-stream = "0.1.19"
toml = "1.1.5"
tonic = "0.14"
tonic-prost = "0.14"

[build-dependencies]
tonic-build = "0.14"
tonic-prost-build = "0.14"

[features]
debug-agent = []
