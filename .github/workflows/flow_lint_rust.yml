name: Lint Rust package

on:
  workflow_call:

env:
  CARGO_TERM_COLOR: always

permissions:
  contents: read

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        name: Checkout project

      - uses: dtolnay/rust-toolchain@stable
        name: Install the Rust toolchain

      - uses: Swatinem/rust-cache@v2
        name: Use cached dependencies and artifacts

      - uses: arduino/setup-protoc@v3
        name: Install Protoc for BoxLite's internal guest protocol

      - uses: actions/setup-node@v4
        name: Install build-time Node.js
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Build and test the embedded console
        run: |
          npm --prefix frontend ci
          npm --prefix frontend test
          npm --prefix frontend run build

      - name: Build the package
        run: cargo build --release -p cloudlet --locked

      - name: Check formatting
        run: cargo fmt --all --check

      - name: Check linting
        run: cargo clippy --workspace --all-targets --locked -- -D warnings

      - name: Test workspace (no KVM required)
        run: cargo test --workspace --locked
